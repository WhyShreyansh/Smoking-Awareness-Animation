<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Day Everything Changed</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="family-healing.css" />
</head>
<body>

<!-- Fixed 3D canvas, sits behind all scroll content -->
<canvas id="scene-canvas"></canvas>

<!-- Fixed light-thread indicator (the ember/sun signature element) -->
<div id="thread-glow" aria-hidden="true"></div>

<main id="story">

  <!-- SCENE 1 — The Decision -->
  <section class="scene" id="scene-1" data-scene="decision">
    <div class="scene-inner">
      <p class="eyebrow">01 — The Decision</p>
      <h2 class="line reveal">Every change begins<br />with one decision.</h2>
    </div>
  </section>

  <!-- SCENE 2 — Breaking Free -->
  <section class="scene" id="scene-2" data-scene="breaking-free">
    <div class="scene-inner">
      <p class="eyebrow">02 — Breaking Free</p>
      <h2 class="line reveal split-line">
        <span class="split-a">The moment you quit&hellip;</span>
        <span class="split-b">&hellip;your future changes.</span>
      </h2>
    </div>
  </section>

  <!-- SCENE 3 — The Family Returns -->
  <section class="scene" id="scene-3" data-scene="family-returns">
    <div class="scene-inner">
      <p class="eyebrow">03 — The Family Returns</p>
      <h2 class="line reveal">The people you love<br />begin to heal.</h2>
    </div>
  </section>
    
</body>
</html>
